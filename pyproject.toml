[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ugc-image-tool"
version = "0.1.0"
description = "UGC AI 生图工具"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8,<7",
    "httpx>=0.27,<1",
    # Windows 用凭据库（ctypes 直调），keyring 只在 macOS 上装，用于钥匙串存 API 密钥
    "keyring>=25,<26; sys_platform == 'darwin'",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "coverage>=7,<8"]

[project.scripts]
ugc-contracts = "ugc_image_tool.contracts.cli:main"
ugc-image-tool = "ugc_image_tool.ui:run"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
