[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ugc-image-tool"
version = "0.1.0"
description = "UGC AI 生图工具"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
ugc-contracts = "ugc_image_tool.contracts.cli:main"
ugc-image-tool = "ugc_image_tool.ui:run"

[tool.setuptools.packages.find]
where = ["src"]
